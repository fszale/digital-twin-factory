name: Repo Hygiene

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        run: |
          test -f AGENTS.md
          test -f CONTEXT.md
          test -f docs/architecture.md
          test -f prisma/schema.prisma
          test -f supabase/schema.sql
          test -f schemas/twin-package.schema.json
          test -f schemas/twin-deployment.schema.json
